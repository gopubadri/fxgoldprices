# Sends a gold price alert every hour in India time.
#
# GitHub often delays or drops a schedule at the top of an hour, so this
# tries at :07 and again at :37. main.py skips the second run when an alert
# was already sent in the past 50 minutes.
#
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   GOLD_API_URL         -> GOLD_API_URL
#   GOLD_API_KEY         -> GOLD_API_KEY
#   TELEGRAM_BOT_TOKEN   -> TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID     -> TELEGRAM_CHAT_ID

name: Hourly gold price

on:
  schedule:
    - cron: '7 * * * *'
      timezone: Asia/Kolkata
    - cron: '37 * * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

concurrency:
  group: gold-price-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch gold price and notify Telegram
        env:
          GOLD_API_URL: ${{ secrets.GOLD_API_URL }}
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save last INR price
        run: |
          git add state/last_price.json
          if git diff --cached --quiet; then
            echo "Last price is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Record last gold price"
          git push
